[Wheel]
; Espera inicial segura antes del primer paso; el minimo permitido es 300 ms.
initial_delay_ms=300
; Duracion del pulso de seleccion. Se mantiene en 50 ms por seguridad.
pulse_ms=50
; Intervalo ajustable entre 100 y 600 ms. 120 agil, 150 pausado, 180 muy pausado.
step_interval_ms=150
; Tiempo para cerrar la barra despues del ultimo giro; el minimo es 550 ms.
release_delay_ms=550
; Preabre la barra tras acumular este delta de rueda (0 desactiva la preapertura).
preopen_threshold=60

[Controller]
; Boton fisico XInput que repite la recoleccion: A, B, X, Y u OFF.
; B corresponde al boton Este (B en Xbox, Circulo en PlayStation con Steam Input).
gather_button=B
; Pulso de F para cada intento de recoleccion: 50-100 ms.
gather_pulse_ms=60
; Tiempo entre intentos: 200-1000 ms. Aumentalo para una repeticion mas pausada.
gather_interval_ms=300
